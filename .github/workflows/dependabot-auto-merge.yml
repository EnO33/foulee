name: Dependabot auto-merge

# Dependabot opens grouped GitHub Actions update PRs weekly. This enables
# GitHub's native auto-merge for patch & minor bumps so they merge on their
# own once the required CI checks (Lint, Build & Test) pass. Major bumps are
# left open for a human to review.
on: pull_request

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # Scoped to the job: `gh pr merge --auto` needs both to flag the PR
    # for merge once the required checks pass.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
