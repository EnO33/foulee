name: Release

# Push a tag like `v0.1.0` to build the app, ship it to TestFlight and publish
# a GitHub release whose notes come from `docs/releases/0.1.0.md` (issue #638),
# followed by their English translation `0.1.0.en.md` under « ## English ».
# The same notes fill the build's « What to Test » in TestFlight (issue #622).
# The marketing version comes from the tag; the build number is the commit
# count (monotonic). See docs/RELEASE.md for the required secrets.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only the last job writes back to GitHub, to create the release; it asks
# for `contents: write` on its own.
permissions:
  contents: read

jobs:
  # Fails in seconds rather than after the build: the notes have to be in the
  # tagged commit, so a tag cut without them is cut again.
  notes:
    name: Release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases

      - name: Find the notes for this version
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Release::Tag « $GITHUB_REF_NAME » : attendu vX.Y.Z."
            exit 1
          fi
          for notes in "docs/releases/$version.md" "docs/releases/$version.en.md"; do
            if [ ! -s "$notes" ]; then
              echo "::error title=Release::$notes absent du commit tagué. Voir docs/RELEASE.md, § 8."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  testflight:
    name: Build & upload to TestFlight
    needs: notes
    # Same image and Xcode as CI (issue #404): what ships is what was tested.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the build number (commit count) is stable

      # Same pin as .github/actions/prepare-project, the reasons with it (issue #660).
      - name: Select Xcode 27.1 or a later 27.x
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '^27.1'

      - name: Ensure the watchOS platform is installed (the iOS app embeds the Watch app)
        run: |
          if xcrun simctl list runtimes available | grep -q "watchOS"; then
            echo "watchOS runtime present"
            exit 0
          fi
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt — downloading watchOS platform"
            if sudo xcodebuild -downloadPlatform watchOS; then
              exit 0
            fi
            echo "Attempt $attempt failed, sleeping 30s before retry"
            sleep 30
          done
          echo "watchOS platform download failed after 4 attempts"
          exit 1

      - name: Install toolchain (Tuist) from mise.toml
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Derive version + build number
        id: ver
        run: |
          echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Materialise signing assets from secrets
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > fastlane/asc_key.p8
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > fastlane/dist_cert.p12
          # Optional dev cert: lets cloud signing reuse a persistent identity
          # instead of minting a throwaway one every run (cert-limit leak).
          if [ -n "${DEV_CERT_P12_BASE64:-}" ]; then
            echo "$DEV_CERT_P12_BASE64" | base64 --decode > fastlane/dev_cert.p12
          fi
          printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > Local.xcconfig

      - name: Tuist install + generate
        run: |
          tuist install
          tuist generate --no-open

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ github.workspace }}/fastlane/asc_key.p8
          DIST_CERT_PATH: ${{ github.workspace }}/fastlane/dist_cert.p12
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DEV_CERT_PATH: ${{ github.workspace }}/fastlane/dev_cert.p12
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          FOULEE_MARKETING_VERSION: ${{ steps.ver.outputs.marketing }}
          FOULEE_BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: fastlane release

      - name: Tidy signing assets
        if: always()
        run: rm -f fastlane/asc_key.p8 fastlane/dist_cert.p12 fastlane/dev_cert.p12 Local.xcconfig

  # After TestFlight: a version that never built gets no release. Re-running
  # the job rewrites the notes rather than failing on a release that exists.
  github-release:
    name: GitHub release
    needs: [notes, testflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          set -euo pipefail
          # The website's « Nouveautés » and « What's new » pages split the
          # body on the « ## English » heading.
          notes="$RUNNER_TEMP/notes.md"
          { cat "docs/releases/$VERSION.md"; printf '\n## English\n\n'; cat "docs/releases/$VERSION.en.md"; } > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Foulée $VERSION" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Foulée $VERSION" --notes-file "$notes"
          fi
