name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          sudo xcode-select -switch "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install Tuist & xcbeautify
        run: brew install --cask tuist && brew install xcbeautify

      - name: Fetch dependencies
        run: tuist install

      - name: Generate project
        run: tuist generate --no-open

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            build | xcbeautify

      - name: Test
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            test | xcbeautify
