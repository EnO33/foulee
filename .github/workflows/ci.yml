name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the change touches, so a Garmin-only change does not wait on the
  # macOS jobs and an app-only one does not download the Connect IQ SDK.
  # The workflow itself, and the actions it shares, count as both.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
      garmin: ${{ steps.filter.outputs.garmin }}
      store: ${{ steps.filter.outputs.store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            apple:
              - *workflow
              - .github/actions/prepare-project/**
              - .github/actions/report-test-failure/**
              - Foulee/**
              - FouleeAccessibilityAudit/**
              - FouleeKit/**
              - FouleeKitTests/**
              - FouleeLaunchTime/**
              - FouleeLiveActivity/**
              - FouleeScreenshots/**
              - FouleeTests/**
              - FouleeWatch/**
              - FouleeWatchScreenshots/**
              - FouleeWatchTests/**
              - FouleeWatchWidget/**
              - FouleeWidget/**
              - Tuist/**
              - tools/**
              - Project.swift
              - Tuist.swift
              - mise.toml
              - .package.resolved
              - .swiftlint.yml
              - .swift-format
              - .periphery.yml
              - .periphery.baseline.json
            garmin:
              - *workflow
              - .github/actions/prepare-connectiq/**
              - FouleeConnectIQ/**
              # The validator checks the app ids the iPhone listens to.
              - Foulee/Connectivity/GarminConnectIQClient.swift
            store:
              - *workflow
              - fastlane/metadata/**
              - tools/check_store_metadata.py

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # Same image as the platform jobs: the release scripts are type-checked
    # with this runner's swiftc, which must be the one that ships the app.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (Tuist, SwiftLint) from mise.toml
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      # tools/ is outside the Xcode project and outside .swiftlint.yml's
      # `included:`, so nothing else here would notice a broken script — and
      # SwiftLint does not fail on parse errors anyway (verified: it reports
      # 0 violations on a file swiftc rejects with 20 errors). The composer's
      # caption table is the one thing docs/RELEASE.md invites the owner to
      # edit between releases; a stray comma there must not wait until release
      # day. One file per invocation: each script has top-level code, and only
      # a `main.swift` may have that when several files share a compilation.
      - name: Type-check the release scripts (tools/)
        run: |
          # Not named `status`: that identifier is read-only in zsh, so the
          # loop below would abort if anyone reran this step in their shell.
          failures=0
          for script in tools/*.swift; do
            echo "swiftc -typecheck $script"
            swiftc -typecheck "$script" || failures=1
          done
          exit $failures

  store:
    # The App Store listing in fastlane/metadata (issue #581): every field
    # present and within App Store Connect's limits, checked here rather than
    # halfway through the « Store listing » workflow's upload.
    name: Store listing
    needs: changes
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the listing
        run: tools/check_store_metadata.py

  connectiq:
    # Static checks on the Garmin watch app (FouleeConnectIQ/) that need no
    # SDK, limited to what the compiler cannot see: production app id, API
    # floor, manifest and devices.json in step, the iPhone listening to the
    # right app ids, no key material committed. Resources and launcher icons
    # are the `connectiq-build` job's, below.
    name: Connect IQ
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    # Pinned to a version, like the macOS jobs around it: a floating label
    # moves the runner image under us without a commit. This job only needs
    # python3, so bumping it is a one-line, deliberate change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Connect IQ project (no SDK required)
        run: FouleeConnectIQ/build.sh validate

  connectiq-build:
    # Compiles the Garmin app for every device of the manifest, in -w -l 3,
    # failing on any warning (build.sh), and
    # compiles its unit-test build (issue #466). The SDK and the device
    # profiles come from ./.github/actions/prepare-connectiq.
    name: Connect IQ build
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    runs-on: ubuntu-24.04
    # Garmin's servers are outside our control: a stalled SDK or profile
    # download must fail the job, not hold a runner for GitHub's six hours.
    # A cold cache takes a few minutes, a warm one under one.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-connectiq
        with:
          sdk-token: ${{ secrets.CIQ_SDK_TOKEN_BASE64 }}
          agreement-hash: ${{ vars.CIQ_AGREEMENT_HASH }}

      # Signing a build needs a key, not *the* key: a throwaway one proves the
      # code compiles. The store key only ever signs a release package.
      - name: Generate a throwaway developer key
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/ci_key.pem" 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in "$RUNNER_TEMP/ci_key.pem" -out "$RUNNER_TEMP/ci_key.der"

      - name: Compile every device of the manifest
        env:
          CIQ_DEVELOPER_KEY: ${{ runner.temp }}/ci_key.der
        run: FouleeConnectIQ/build.sh build

      - name: Compile the unit-test build
        env:
          CIQ_DEVELOPER_KEY: ${{ runner.temp }}/ci_key.der
        run: FouleeConnectIQ/build.sh test

      - name: Upload the compiler logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connectiq-logs
          path: FouleeConnectIQ/bin/logs
          if-no-files-found: ignore

  # The pure logic and the shared models (issue #425, ADR 0007), tested on the
  # runner's own macOS: no simulator to install, boot or launch.
  kit:
    name: Kit
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      # The architecture is named: « My Mac » matches arm64 and x86_64, and
      # xcodebuild would otherwise pick one with a warning.
      - name: Test (FouleeKit, macOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeKit \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/kit.xcresult \
            test | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: kit

  # iOS and watchOS run side by side (issue #406). Each compiles once —
  # `build-for-testing`, then `test-without-building` — instead of a `build`
  # followed by a `test` that recompiled everything.
  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    # GitHub's Xcode 27 image (issue #404): macOS 27, Xcode 27.x, iOS 27 and
    # watchOS 27 simulators preinstalled. The general-purpose macos-26 image
    # tops out at Xcode 26.6, and Xcode 27 does not run on macos-15 at all
    # (it needs macOS Tahoe 26.6).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      # The simulator is the one Xcode accepts, as for the watch (issue #462),
      # not a model written down here: an image update retires models, and
      # the iOS 27.1 runtime of the Xcode 27.2 image refuses an iPhone 17 Pro
      # (« Incompatible device »). Without any, one is created from the
      # newest iPhone the newest runtime supports.
      - name: Pick the iPhone simulator
        run: |
          eligible_iphone() {
            xcodebuild -workspace Foulee.xcworkspace -scheme Foulee -showdestinations 2>/dev/null \
              | awk '/Ineligible destinations/ { exit } /platform:iOS Simulator/ && /name:iPhone/ && !/placeholder/' \
              | sed -n 's/.*id:\([^,]*\),.*/\1/p' \
              | head -1
          }
          IOS_UDID=$(eligible_iphone)
          if [ -z "$IOS_UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -c '[.runtimes[] | select(.platform == "iOS")] | sort_by(.version) | last')
            DEVICETYPE=$(echo "$RUNTIME" | jq -r '[.supportedDeviceTypes[] | select(.productFamily == "iPhone")] | last | .identifier')
            echo "Creating an iPhone ($DEVICETYPE) on $(echo "$RUNTIME" | jq -r .identifier)"
            xcrun simctl create "CI iPhone" "$DEVICETYPE" "$(echo "$RUNTIME" | jq -r .identifier)"
            IOS_UDID=$(eligible_iphone)
          fi
          if [ -z "$IOS_UDID" ]; then
            echo "No iOS simulator Xcode accepts"
            xcodebuild -workspace Foulee.xcworkspace -scheme Foulee -showdestinations
            exit 1
          fi
          echo "Testing on simulator $IOS_UDID"
          echo "IOS_UDID=$IOS_UDID" >> "$GITHUB_ENV"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$IOS_UDID" >> "$GITHUB_ENV"

      # A fixed derivedDataPath: `test-without-building` below reuses this
      # build.
      - name: Build for testing (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination "$IOS_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      # Booted explicitly, and waited for, before the tests. A device created
      # on a fresh runtime can take minutes to finish its first boot; left to
      # xcodebuild, that wait counts against the test runner's launch, which
      # then gives up with « crashed before establishing connection » (issue
      # #404). Booting here keeps a slow boot and a real launch crash apart.
      - name: Boot the iPhone simulator
        timeout-minutes: 10
        run: |
          echo "Booting simulator $IOS_UDID"
          xcrun simctl bootstatus "$IOS_UDID" -b

      # `-collect-test-diagnostics never` (issue #420): at the end of a run,
      # xcodebuild asks the simulator for diagnostics, and the iOS 27 one never
      # answers — every run waited out the full 600 s timeout after tests that
      # take 15. A crash still reaches the log through report-test-failure.
      - name: Test (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination "$IOS_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/ios.xcresult \
            -collect-test-diagnostics never \
            test-without-building | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: ios

  # Xcode's accessibility audit on the iPhone app's main screens (issue #602),
  # beside the unit tests rather than inside them: it launches the app eleven
  # times. Fails on a finding FouleeAccessibilityAudit/AccessibilityAuditBaseline.json
  # does not list; the script creates its own simulator, the same way as on a
  # Mac, because the findings depend on the screen and the iOS version.
  accessibility:
    name: Accessibility audit
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      - name: Audit (iOS)
        run: tools/accessibility_audit.sh

      # What the baseline would be after this run, to refresh it from the CI
      # simulator once a finding is fixed.
      - name: Upload the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessibility-audit
          path: build/accessibility/AccessibilityAuditBaseline.json
          if-no-files-found: ignore

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: accessibility

  # The iPhone app's cold launch time (issue #613), in its own job for the
  # same reason as the audit: it launches the app seven times. Fails when the
  # median launch is more than FouleeLaunchTime/LaunchTimeBudget.json allows.
  launch:
    name: Launch time
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      - name: Launch time (iOS)
        run: tools/launch_time.sh

      # What the budget would be after this run, to record it from the CI
      # simulator rather than from a faster Mac.
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: launch-time
          path: build/launch/LaunchTimeBudget.json
          if-no-files-found: ignore

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: launch

  watchos:
    name: watchOS
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      # Xcode picks the simulator, not us, once the image has finished
      # installing its watchOS runtime (issue #462).
      #
      # A fresh runner can still be provisioning it when the job starts: the
      # same runtime is registered several times over one disk image, one copy
      # « Copying » while another is « Deleting ». Until that settles the
      # runtime comes and goes — listed, then refused at boot (« runtime
      # profile not found »), or pulled from under a running test. It settles
      # within seconds; the job waits for that (3 min at most), then takes the
      # first watchOS simulator the scheme accepts: no version, model or
      # runtime written down here.
      - name: Pick and boot the Apple Watch simulator
        run: |
          watch_image_states() {
            xcrun simctl runtime list -j \
              | jq -r '[to_entries[] | select(.value.platformIdentifier | test("watch"; "i")) | .value.state] | join(", ")'
          }
          # Settled: at least one image « Ready » and none still moving
          # (« Copying », « Deleting »). Leftover copies stay « Unusable » for
          # good, so waiting for *every* image to be ready never ends.
          watch_runtime_settled() {
            xcrun simctl runtime list -j | jq -e '
              [to_entries[] | select(.value.platformIdentifier | test("watch"; "i")) | .value.state]
              | any(. == "Ready") and all(test("ing$") | not)' >/dev/null
          }
          for attempt in $(seq 1 18); do
            watch_runtime_settled && break
            echo "watchOS runtime images still settling: $(watch_image_states)"
            sleep 10
          done
          eligible_watch() {
            xcodebuild -workspace Foulee.xcworkspace -scheme FouleeWatch -showdestinations 2>/dev/null \
              | awk '/Ineligible destinations/ { exit } /platform:watchOS Simulator/ && !/placeholder/' \
              | sed -n 's/.*id:\([^,]*\),.*/\1/p' \
              | head -1
          }
          WATCH_UDID=$(eligible_watch)
          if [ -z "$WATCH_UDID" ]; then
            echo "No watchOS simulator Xcode accepts"
            xcrun simctl runtime list -v || true
            xcodebuild -workspace Foulee.xcworkspace -scheme FouleeWatch -showdestinations
            exit 1
          fi
          # Same reason as the iPhone: finish the first boot before the test
          # runner's launch clock starts.
          if ! xcrun simctl bootstatus "$WATCH_UDID" -b; then
            xcrun simctl runtime list -v || true
            exit 1
          fi
          echo "Testing on simulator $WATCH_UDID"
          echo "WATCH_DESTINATION=platform=watchOS Simulator,id=$WATCH_UDID" >> "$GITHUB_ENV"

      - name: Build for testing (watchOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "$WATCH_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      - name: Test (watchOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "$WATCH_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/watchos.xcresult \
            -collect-test-diagnostics never \
            test-without-building | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: watchos

  # Dead-code scan, in its own job (issue #433): it ran at the end of the iOS
  # job and added about 4 minutes to the longest path of every PR. Here it
  # runs beside the test jobs. PR-only: the baseline (.periphery.baseline.json)
  # freezes today's findings, so only NEW unused code fails the check. Refresh
  # it after clearing a finding:
  # `periphery scan --write-baseline .periphery.baseline.json`.
  deadcode:
    name: Dead code
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      # Periphery reads the index of every scheme in .periphery.yml. These
      # builds only fill that index: no simulator is booted, nothing runs.
      #
      # Generic simulator destinations, pinned to arm64: a generic destination
      # otherwise builds every simulator architecture, and the watch build
      # would recompile the watch app the iPhone build already embedded.
      #
      # 1. The iPhone app, its extensions, the embedded watch app, FouleeTests.
      # 2. FouleeWatchTests, on top of the watch app built in 1.
      # 3. FouleeKitTests, on macOS: a declaration only the kit's tests reach
      #    would otherwise be reported as dead.
      - name: Index the project for the dead-code scan
        run: |
          set -o pipefail
          index() {
            xcodebuild \
              -workspace Foulee.xcworkspace \
              -scheme "$1" \
              -destination "$2" \
              -configuration Debug \
              -derivedDataPath build/dd \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
              build-for-testing | xcbeautify
          }
          index Foulee 'generic/platform=iOS Simulator'
          index FouleeWatch 'generic/platform=watchOS Simulator'
          index FouleeKit 'platform=macOS,arch=arm64'

      - name: Install Periphery 3.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/periphery"
          gh release download 3.8.0 \
            --repo peripheryapp/periphery \
            --pattern 'periphery-3.8.0.zip' \
            --dir "$HOME/periphery"
          (cd "$HOME/periphery" && unzip -o periphery-3.8.0.zip)
          # The binary loads libIndexStore.dylib from alongside itself.
          echo "$HOME/periphery" >> "$GITHUB_PATH"

      # --skip-build: the index above is already there.
      - name: Dead code (Periphery, reusing the build index)
        run: |
          periphery scan \
            --skip-build \
            --index-store-path build/dd/Index.noindex/DataStore \
            --baseline .periphery.baseline.json \
            --strict \
            --relative-results \
            --format github-actions

  build:
    # Keep this name "Build & Test": it's a required status check in main's
    # branch protection. The work now happens in the jobs above; this one
    # only reports their outcome, so the protection rule needs no change.
    # `always()`: a skipped aggregator would count as passing — alls-green
    # fails it unless every job it needs succeeded or was allowed to skip.
    # Every job but `changes` may skip: it runs only when the change touches
    # its side (and the dead-code job only on pull requests).
    name: Build & Test
    needs: [changes, lint, store, connectiq, connectiq-build, kit, ios, accessibility, launch, watchos, deadcode]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every platform passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: lint, store, connectiq, connectiq-build, kit, ios, accessibility, launch, watchos, deadcode
          jobs: ${{ toJSON(needs) }}
