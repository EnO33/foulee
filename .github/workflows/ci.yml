name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    # Same image as the platform jobs: the release scripts are type-checked
    # with this runner's swiftc, which must be the one that ships the app.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (Tuist, SwiftLint) from mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      # tools/ is outside the Xcode project and outside .swiftlint.yml's
      # `included:`, so nothing else here would notice a broken script — and
      # SwiftLint does not fail on parse errors anyway (verified: it reports
      # 0 violations on a file swiftc rejects with 20 errors). The composer's
      # caption table is the one thing docs/RELEASE.md invites the owner to
      # edit between releases; a stray comma there must not wait until release
      # day. One file per invocation: each script has top-level code, and only
      # a `main.swift` may have that when several files share a compilation.
      - name: Type-check the release scripts (tools/)
        run: |
          # Not named `status`: that identifier is read-only in zsh, so the
          # loop below would abort if anyone reran this step in their shell.
          failures=0
          for script in tools/*.swift; do
            echo "swiftc -typecheck $script"
            swiftc -typecheck "$script" || failures=1
          done
          exit $failures

  connectiq:
    # Static checks on the Garmin watch app (FouleeConnectIQ/). This job does
    # NOT compile Monkey C, and it can't:
    #
    #   * The SDK archive itself is public and scriptable — sdks.json lists it
    #     and connectiq-sdk-lin-9.2.0-….zip serves anonymously (HTTP 200).
    #   * But the SDK ships *no device profiles*. Verified: the zip contains no
    #     Devices/ entry, and monkeyc on a clean home answers
    #     "ERROR: Invalid device id specified: 'venu2'". Profiles come from
    #     api.gcs.garmin.com/ciq-product-onboarding/devices, which is 401
    #     without a Garmin *account* bearer token — the SDK Manager is a GUI
    #     with an SSO login, and the only non-interactive route known
    #     (lindell/connect-iq-sdk-manager-cli) wants GARMIN_USERNAME /
    #     GARMIN_PASSWORD. That is the account holding the owner's Garmin
    #     Connect health data; it does not belong in repository secrets.
    #   * Vendoring the profiles instead is barred by the Connect IQ agreement
    #     (§I(b): no hosting or redistributing Program Materials).
    #
    # So the compile gate lives on the developer's machine
    # (`FouleeConnectIQ/build.sh build`, seven devices, -w -l 3) and CI checks
    # everything that is knowable from the files: manifest well-formedness,
    # device ids matching their resources folder, launcher icons at the exact
    # per-device pixel size, no key material committed. Details and the
    # opt-in recipe if this trade-off is ever revisited: FouleeConnectIQ/README.md.
    name: Connect IQ
    # Pinned to a version, like the macOS jobs around it: a floating label
    # moves the runner image under us without a commit. This job only needs
    # python3, so bumping it is a one-line, deliberate change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Connect IQ project (no SDK required)
        run: FouleeConnectIQ/build.sh validate

  # The pure logic and the shared models (issue #425, ADR 0007), tested on the
  # runner's own macOS: no simulator to install, boot or launch.
  kit:
    name: Kit
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      # The architecture is named: « My Mac » matches arm64 and x86_64, and
      # xcodebuild would otherwise pick one with a warning.
      - name: Test (FouleeKit, macOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeKit \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/kit.xcresult \
            test | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: kit

  # iOS and watchOS run side by side (issue #406). Each compiles once —
  # `build-for-testing`, then `test-without-building` — instead of a `build`
  # followed by a `test` that recompiled everything.
  ios:
    name: iOS
    # GitHub's Xcode 27 image (issue #404): macOS 27, Xcode 27.0, iOS 27 and
    # watchOS 27 simulators preinstalled. The general-purpose macos-26 image
    # tops out at Xcode 26.6, and Xcode 27 does not run on macos-15 at all
    # (it needs macOS Tahoe 26.6).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      - name: Ensure iPhone 17 Pro simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '.runtimes[] | select(.platform == "iOS") | .identifier' | sort -V | tail -1)
            DEVICETYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier')
            echo "Creating iPhone 17 Pro on runtime $RUNTIME (devicetype $DEVICETYPE)"
            xcrun simctl create "iPhone 17 Pro" "$DEVICETYPE" "$RUNTIME"
          fi
          xcrun simctl list devices available | grep -E "iPhone 17"

      # A fixed derivedDataPath lets the dead-code step below reuse this
      # build's index store instead of building the project a second time.
      - name: Build for testing (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      # Booted explicitly, and waited for, before the tests. A device created
      # on a fresh runtime can take minutes to finish its first boot; left to
      # xcodebuild, that wait counts against the test runner's launch, which
      # then gives up with « crashed before establishing connection » (issue
      # #404). Booting here keeps a slow boot and a real launch crash apart.
      - name: Boot the iPhone simulator
        timeout-minutes: 10
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          echo "Booting iPhone 17 Pro ($UDID)"
          xcrun simctl bootstatus "$UDID" -b

      # `-collect-test-diagnostics never` (issue #420): at the end of a run,
      # xcodebuild asks the simulator for diagnostics, and the iOS 27 one never
      # answers — every run waited out the full 600 s timeout after tests that
      # take 15. A crash still reaches the log through report-test-failure.
      - name: Test (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/ios.xcresult \
            -collect-test-diagnostics never \
            test-without-building | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: ios

      # Periphery scans both schemes. The iPhone app embeds the watch app, so
      # the build above already indexed FouleeWatch; only the watch's test
      # target is left. The watchOS job runs those tests — this step only fills
      # in the index.
      #
      # A concrete simulator, not `generic/platform=watchOS Simulator`: the
      # generic destination builds every simulator architecture, so it rebuilt
      # the whole watch app a second time (6 min 50 s on the Xcode 27 image)
      # instead of adding the test target to the build above.
      - name: Index the watch tests for the dead-code scan
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          WATCH_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("Apple Watch"))][0].udid')
          DESTINATION="platform=watchOS Simulator,id=$WATCH_ID"
          if [ "$WATCH_ID" = "null" ]; then
            DESTINATION="generic/platform=watchOS Simulator"
          fi
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      # The kit's tests run in the Kit job, on macOS. Built here only so the
      # scan sees what they use: a declaration only its tests reach is
      # otherwise reported as dead.
      - name: Index the kit tests for the dead-code scan
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeKit \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      # Dead-code scan reuses the index from the builds above (--skip-build via
      # --index-store-path), so it costs seconds, not a second build. PR-only:
      # the baseline (.periphery.baseline.json) freezes today's findings, so
      # only NEW unused code fails the check. Refresh after clearing a finding:
      # `periphery scan --write-baseline .periphery.baseline.json`.
      - name: Install Periphery 3.8.0
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/periphery"
          gh release download 3.8.0 \
            --repo peripheryapp/periphery \
            --pattern 'periphery-3.8.0.zip' \
            --dir "$HOME/periphery"
          (cd "$HOME/periphery" && unzip -o periphery-3.8.0.zip)
          # The binary loads libIndexStore.dylib from alongside itself.
          echo "$HOME/periphery" >> "$GITHUB_PATH"

      - name: Dead code (Periphery, reusing the build index)
        if: github.event_name == 'pull_request'
        run: |
          periphery scan \
            --skip-build \
            --index-store-path build/dd/Index.noindex/DataStore \
            --baseline .periphery.baseline.json \
            --strict \
            --relative-results \
            --format github-actions

  watchos:
    name: watchOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/prepare-project

      - name: Ensure Apple Watch simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "Apple Watch"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '.runtimes[] | select(.platform == "watchOS") | .identifier' | sort -V | tail -1)
            DEVICETYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.productFamily == "Apple Watch") | .identifier' | tail -1)
            echo "Creating Apple Watch on runtime $RUNTIME (devicetype $DEVICETYPE)"
            xcrun simctl create "Apple Watch" "$DEVICETYPE" "$RUNTIME"
          fi
          xcrun simctl list devices available | grep -E "Apple Watch"

      # The ensure step above guarantees an Apple Watch simulator exists, but
      # its exact name depends on the runtime's default devices — resolve it
      # instead of hardcoding one.
      - name: Pick the Apple Watch simulator
        run: |
          WATCH_NAME=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("Apple Watch"))][0].name')
          if [ -z "$WATCH_NAME" ] || [ "$WATCH_NAME" = "null" ]; then
            echo "No Apple Watch simulator available"
            xcrun simctl list devices
            exit 1
          fi
          echo "Testing on simulator: $WATCH_NAME"
          echo "WATCH_DESTINATION=platform=watchOS Simulator,name=$WATCH_NAME" >> "$GITHUB_ENV"
          # Same reason as the iPhone: finish the first boot before the test
          # runner's launch clock starts.
          WATCH_UDID=$(xcrun simctl list devices available -j | jq -r --arg name "$WATCH_NAME" '[.devices[][] | select(.name == $name)][0].udid')
          xcrun simctl bootstatus "$WATCH_UDID" -b

      - name: Build for testing (watchOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "$WATCH_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            build-for-testing | xcbeautify

      - name: Test (watchOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "$WATCH_DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/dd \
            -resultBundlePath build/results/watchos.xcresult \
            -collect-test-diagnostics never \
            test-without-building | xcbeautify

      - uses: ./.github/actions/report-test-failure
        if: failure()
        with:
          name: watchos

  build:
    # Keep this name "Build & Test": it's a required status check in main's
    # branch protection. The work now happens in the jobs above; this one
    # only reports their outcome, so the protection rule needs no change.
    # `always()`: a skipped aggregator would count as passing — alls-green
    # fails it unless every job it needs succeeded.
    name: Build & Test
    needs: [kit, ios, watchos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every platform passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
