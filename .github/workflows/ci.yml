name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (Tuist, SwiftLint) from mise.toml
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

      # tools/ is outside the Xcode project and outside .swiftlint.yml's
      # `included:`, so nothing else here would notice a broken script — and
      # SwiftLint does not fail on parse errors anyway (verified: it reports
      # 0 violations on a file swiftc rejects with 20 errors). The composer's
      # caption table is the one thing docs/RELEASE.md invites the owner to
      # edit between releases; a stray comma there must not wait until release
      # day. One file per invocation: each script has top-level code, and only
      # a `main.swift` may have that when several files share a compilation.
      - name: Type-check the release scripts (tools/)
        run: |
          # Not named `status`: that identifier is read-only in zsh, so the
          # loop below would abort if anyone reran this step in their shell.
          failures=0
          for script in tools/*.swift; do
            echo "swiftc -typecheck $script"
            swiftc -typecheck "$script" || failures=1
          done
          exit $failures

  connectiq:
    # Static checks on the Garmin watch app (FouleeConnectIQ/). This job does
    # NOT compile Monkey C, and it can't:
    #
    #   * The SDK archive itself is public and scriptable — sdks.json lists it
    #     and connectiq-sdk-lin-9.2.0-….zip serves anonymously (HTTP 200).
    #   * But the SDK ships *no device profiles*. Verified: the zip contains no
    #     Devices/ entry, and monkeyc on a clean home answers
    #     "ERROR: Invalid device id specified: 'venu2'". Profiles come from
    #     api.gcs.garmin.com/ciq-product-onboarding/devices, which is 401
    #     without a Garmin *account* bearer token — the SDK Manager is a GUI
    #     with an SSO login, and the only non-interactive route known
    #     (lindell/connect-iq-sdk-manager-cli) wants GARMIN_USERNAME /
    #     GARMIN_PASSWORD. That is the account holding the owner's Garmin
    #     Connect health data; it does not belong in repository secrets.
    #   * Vendoring the profiles instead is barred by the Connect IQ agreement
    #     (§I(b): no hosting or redistributing Program Materials).
    #
    # So the compile gate lives on the developer's machine
    # (`FouleeConnectIQ/build.sh build`, seven devices, -w -l 3) and CI checks
    # everything that is knowable from the files: manifest well-formedness,
    # device ids matching their resources folder, launcher icons at the exact
    # per-device pixel size, no key material committed. Details and the
    # opt-in recipe if this trade-off is ever revisited: FouleeConnectIQ/README.md.
    name: Connect IQ
    # Pinned to a version, like the macos-15 jobs around it: a floating label
    # moves the runner image under us without a commit. This job only needs
    # python3, so bumping it is a one-line, deliberate change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Connect IQ project (no SDK required)
        run: FouleeConnectIQ/build.sh validate

  build:
    # Keep this name "Build & Test": it's a required status check in main's
    # branch protection. The job also runs the dead-code scan (a final step),
    # but renaming it would orphan the required check and block every merge.
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.0'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Download watchOS platform (not pre-installed on the runner)
        run: |
          # GitHub macos-15 runners are flaky on first `downloadPlatform`:
          # the CoreSimulator service can come up late and Xcode errors with
          # 'Unable to connect to simulator'. Retry a few times with backoff.
          for attempt in 1 2 3 4; do
            echo "Attempt $attempt — downloading watchOS platform"
            if sudo xcodebuild -downloadPlatform watchOS; then
              exit 0
            fi
            echo "Attempt $attempt failed, sleeping 30s before retry"
            sleep 30
          done
          echo "watchOS platform download failed after 4 attempts"
          exit 1

      - name: Install toolchain (Tuist) from mise.toml
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Ensure iPhone 17 Pro simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 17 Pro"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '.runtimes[] | select(.platform == "iOS") | .identifier' | sort -V | tail -1)
            DEVICETYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier')
            echo "Creating iPhone 17 Pro on runtime $RUNTIME (devicetype $DEVICETYPE)"
            xcrun simctl create "iPhone 17 Pro" "$DEVICETYPE" "$RUNTIME"
          fi
          xcrun simctl list devices available | grep -E "iPhone 17"

      - name: Ensure Apple Watch simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -q "Apple Watch"; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '.runtimes[] | select(.platform == "watchOS") | .identifier' | sort -V | tail -1)
            DEVICETYPE=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.productFamily == "Apple Watch") | .identifier' | tail -1)
            echo "Creating Apple Watch on runtime $RUNTIME (devicetype $DEVICETYPE)"
            xcrun simctl create "Apple Watch" "$DEVICETYPE" "$RUNTIME"
          fi
          xcrun simctl list devices available | grep -E "Apple Watch"

      - name: Cache Tuist + SPM artefacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/tuist
            ~/Library/Caches/org.tuist.Tuist
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist.swift', 'Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Tuist install (fetch SPM dependencies)
        run: tuist install

      - name: Tuist generate (Foulee.xcworkspace)
        run: tuist generate --no-open

      # A fixed derivedDataPath lets the dead-code step below reuse this
      # build's index store instead of building the project a second time.
      - name: Build (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            -derivedDataPath build/dd \
            build | xcbeautify

      - name: Build (watchOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/dd \
            build | xcbeautify

      - name: Test (iOS)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme Foulee \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -configuration Debug \
            -derivedDataPath build/dd \
            test | xcbeautify

      - name: Test (watchOS)
        run: |
          set -o pipefail
          # The ensure step above guarantees an Apple Watch simulator exists,
          # but its exact name depends on the runtime's default devices —
          # resolve it instead of hardcoding one.
          WATCH_NAME=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("Apple Watch"))][0].name')
          if [ -z "$WATCH_NAME" ] || [ "$WATCH_NAME" = "null" ]; then
            echo "No Apple Watch simulator available"
            xcrun simctl list devices
            exit 1
          fi
          echo "Testing on simulator: $WATCH_NAME"
          xcodebuild \
            -workspace Foulee.xcworkspace \
            -scheme FouleeWatch \
            -destination "platform=watchOS Simulator,name=$WATCH_NAME" \
            -configuration Debug \
            -derivedDataPath build/dd \
            test | xcbeautify

      # Dead-code scan reuses the index from the builds above (--skip-build via
      # --index-store-path), so it costs seconds, not a second build. PR-only:
      # the baseline (.periphery.baseline.json) freezes today's findings, so
      # only NEW unused code fails the check. Refresh after clearing a finding:
      # `periphery scan --write-baseline .periphery.baseline.json`.
      - name: Install Periphery 3.7.4
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/periphery"
          gh release download 3.7.4 \
            --repo peripheryapp/periphery \
            --pattern 'periphery-3.7.4.zip' \
            --dir "$HOME/periphery"
          (cd "$HOME/periphery" && unzip -o periphery-3.7.4.zip)
          # The binary loads libIndexStore.dylib from alongside itself.
          echo "$HOME/periphery" >> "$GITHUB_PATH"

      - name: Dead code (Periphery, reusing the build index)
        if: github.event_name == 'pull_request'
        run: |
          periphery scan \
            --skip-build \
            --index-store-path build/dd/Index.noindex/DataStore \
            --baseline .periphery.baseline.json \
            --strict \
            --relative-results \
            --format github-actions
