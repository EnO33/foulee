name: Prepare the Xcode project
description: >
  Select Xcode, install the watchOS platform and the toolchain, then generate
  Foulee.xcworkspace. Shared by the iOS and watchOS test jobs (issue #406), so
  the two cannot drift apart.

runs:
  using: composite
  steps:
    - name: Select the latest stable Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      shell: bash
      run: xcodebuild -version

    # Both jobs need it: the iPhone app embeds the watch app, so building
    # Foulee builds FouleeWatch for the watchOS simulator too. The Xcode 27
    # image ships the runtime, unlike macos-15 did; kept as a guard so an image
    # without it downloads it here instead of failing on a missing destination.
    #
    # Read as JSON, the way the watchOS job reads it to create its simulator
    # (issue #460): a grep on the text listing once said « present » while
    # the JSON held no watchOS runtime, and the download was never tried.
    - name: Ensure the watchOS platform is installed
      shell: bash
      run: |
        xcrun simctl list runtimes
        WATCH_RUNTIMES=$(xcrun simctl list runtimes available -j | jq '[.runtimes[] | select(.platform == "watchOS")] | length')
        if [ "$WATCH_RUNTIMES" -gt 0 ]; then
          echo "watchOS runtime present"
          exit 0
        fi
        for attempt in 1 2 3 4; do
          echo "Attempt $attempt — downloading watchOS platform"
          if sudo xcodebuild -downloadPlatform watchOS; then
            exit 0
          fi
          echo "Attempt $attempt failed, sleeping 30s before retry"
          sleep 30
        done
        echo "watchOS platform download failed after 4 attempts"
        exit 1

    - name: Install toolchain (Tuist) from mise.toml
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

    - name: Install xcbeautify
      shell: bash
      run: brew install xcbeautify

    - name: Cache Tuist + SPM artefacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/tuist
          ~/Library/Caches/org.tuist.Tuist
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
        key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist.swift', 'Project.swift', 'Tuist/**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-

    - name: Tuist install (fetch SPM dependencies)
      shell: bash
      run: tuist install

    - name: Tuist generate (Foulee.xcworkspace)
      shell: bash
      run: tuist generate --no-open
